version: 2

project_name: markdown-reviewer

# The SPA must be built first: cmd/server go:embeds internal/static/dist.
before:
  hooks:
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: server
    main: ./cmd/server
    binary: markdown-review-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: mr
    main: ./cmd/mr
    binary: mr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: markdown-reviewer
    repository:
      owner: rengotaku
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/rengotaku/markdown-reviewer
    description: >-
      Review local Markdown in a web editor with sidecar comments,
      AI-friendly via the bundled mr CLI
    license: MIT
    binaries:
      - markdown-review-server
      - mr
    caveats: |
      起動例:
        REVIEW_ROOT=$HOME/notes markdown-review-server
      コメントの読み書き (AI 向け CLI):
        mr inbox / mr review <path> / mr reply / mr resolve
    # Unsigned binaries: strip the quarantine attribute so Gatekeeper
    # doesn't block the first run.
    #
    # This has to go through custom_block rather than hooks.post.install:
    # that option emits `postflight`, which Homebrew deprecated in favour of
    # `postflight_steps`, so every `brew` command touching the Cask printed a
    # warning. GoReleaser cannot emit the new stanza yet — the option for it is
    # https://github.com/goreleaser/goreleaser/pull/6873 (open). Once that
    # lands, move this back under `hooks.post.install_steps` and drop the
    # custom_block, which also puts the stanza back in Cask Cookbook order.
    #
    # `{{staged_path}}` is a Homebrew install-steps token, and GoReleaser runs
    # a final template pass over the whole generated Cask, so it is quoted to
    # survive that pass.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/markdown-review-server"]
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/mr"]
        end
      end
